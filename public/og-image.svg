<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062d1d"/>
      <stop offset="35%" stop-color="#0a5c3d"/>
      <stop offset="70%" stop-color="#0a8b62"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#022c22" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="-120" cy="120" r="240" fill="#34d399" opacity="0.08"/>
  <circle cx="1280" cy="560" r="260" fill="#a7f3d0" opacity="0.08"/>
  <circle cx="610" cy="-60" r="200" fill="#d1fae5" opacity="0.04"/>
  <line x1="0" y1="110" x2="1200" y2="110" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="0" y1="515" x2="1200" y2="515" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(85 110)" filter="url(#drop)">
    <circle cx="120" cy="155" r="125" fill="url(#halo)"/>
    <circle cx="120" cy="155" r="118" fill="none" stroke="#a7f3d0" stroke-opacity="0.32" stroke-width="2"/>
    <circle cx="120" cy="155" r="136" fill="none" stroke="#d1fae5" stroke-opacity="0.16" stroke-width="1.5"/>

    <ellipse cx="115" cy="278" rx="52" ry="14" fill="#ffffff" opacity="0.12"/>
    <path d="M 115 278 Q 111 220 115 150" fill="none" stroke="url(#leaf)" stroke-width="10" stroke-linecap="round"/>

    <ellipse cx="55" cy="190" rx="42" ry="74" fill="url(#leaf)" opacity="0.97" transform="rotate(-42 55 190)"/>
    <path d="M 55 118 Q 32 145 16 190" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>

    <ellipse cx="185" cy="190" rx="42" ry="74" fill="url(#leaf)" opacity="0.97" transform="rotate(42 185 190)"/>
    <path d="M 185 118 Q 208 145 224 190" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>

    <ellipse cx="120" cy="85" rx="34" ry="64" fill="#ffffff" opacity="0.96"/>
    <path d="M 120 20 Q 120 46 120 85" fill="none" stroke="#d1fae5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="translate(420 90)">
    <rect x="0" y="0" width="58" height="4" rx="2" fill="#a7f3d0"/>
    <text x="0" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="2">
      <tspan fill="#ffffff">KRISHI</tspan><tspan fill="#d1fae5">-MITRA</tspan>
    </text>
    <text x="0" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#dcfce7" letter-spacing="1.2">Smart Agriculture Intelligence</text>

    <g transform="translate(0 240)">
      <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#ecfdf5" opacity="0.96">Climate • Advisory • Diagnostics</text>
      <text x="0" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#ecfdf5" opacity="0.8">Real-time insights for modern farming</text>
    </g>

    <g transform="translate(0 292)">
      <g>
        <circle cx="0" cy="6" r="6" fill="#a7f3d0"/>
        <text x="20" y="12" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#ecfdf5">Localized Weather Insights</text>
      </g>
      <g transform="translate(0 40)">
        <circle cx="0" cy="6" r="6" fill="#a7f3d0"/>
        <text x="20" y="12" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#ecfdf5">Expert Crop Guidance</text>
      </g>
      <g transform="translate(0 80)">
        <circle cx="0" cy="6" r="6" fill="#a7f3d0"/>
        <text x="20" y="12" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#ecfdf5">Disease Detection AI</text>
      </g>
    </g>
  </g>

  <rect x="0" y="580" width="1200" height="50" fill="#ffffff" opacity="0.08"/>
  <rect x="0" y="580" width="1200" height="2" fill="#a7f3d0" opacity="0.35"/>
  <text x="600" y="613" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#ecfdf5" letter-spacing="0.4">Empowering Farmers • Enhancing Harvests • Enabling Growth</text>
</svg>
